name: Code style

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: code-style-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: back/pyproject.toml

      - name: Install dev dependencies
        run: uv sync --python 3.12

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check --diff .

  frontend:
    name: Frontend (eslint, prettier, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  infra:
    name: Infra (cfn-lint, terraform fmt/validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Lint CloudFormation templates
        run: uvx cfn-lint --format parseable infra/*.yaml

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # Plans and applies run in HCP Terraform; CI only checks style and validity, without a backend.
      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate Terraform
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
