AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Paste an agenda. The agenda-parser Lambda (backend image, outside the VPC) takes
  pasted text on a public, Cognito-authenticated function URL, asks Claude on Amazon Bedrock for a
  structured agenda and returns it as a suggestion. It never touches the database: the user saves
  through the normal API. Plus a monthly AWS Budgets alarm.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  # --- From the backend and Cognito stacks (the Makefile passes their outputs) ---
  ImageUri:
    Type: String
    Description: The backend image; the parser runs it with a different command.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CorsOrigins:
    Type: CommaDelimitedList
    Description: Browser origins allowed to call the parser (the site's and the local ones).

  # --- The parser ---
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    AllowedValues:
      - anthropic.claude-opus-5-5
      - anthropic.claude-sonnet-5-5
      - anthropic.claude-haiku-5-5
    Description: Bedrock model ID; switching models is a stack update, not a code change.
  ParserMaxChars:
    Type: Number
    Default: 10000
    Description: Longer pasted text is rejected with 413 before the model is called.
  LogRetentionDays:
    Type: Number
    Default: 7

  # --- Budget ---
  BudgetEmail:
    Type: String
    Description: Where the budget alarm is emailed.
  BudgetLimitUsd:
    Type: Number
    Default: 5
    Description: Monthly cost of the whole account that triggers the alarm.

Resources:
  # =====================================================================
  # Agenda parser: the backend image, outside the VPC (Bedrock and Cognito's JWKS over the internet)
  # =====================================================================
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-agenda-parser
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Logs and Bedrock inference only: no database, no S3, no VPC.
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # "*" for now: narrowing it to the one model is a discussion question (docs/ai-agenda-lab.md).
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-agenda-parser
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: [app.ai.agenda_lambda.handler]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      # A parse takes 2-8 s; one retry after invalid output can double that.
      Timeout: 30
      Role: !GetAtt ParserRole.Arn
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
        LogFormat: JSON
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          PARSER_MAX_CHARS: !Ref ParserMaxChars
          BEDROCK_REGION: !Ref AWS::Region
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Public URL; the handler itself rejects requests without a valid Cognito ID token (401).
  ParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref CorsOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  # A public function URL needs both permissions.
  ParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # =====================================================================
  # Budget: an email when the month's actual (or forecast) cost passes the limit
  # =====================================================================
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ParserUrl:
    Description: Function URL the frontend posts pasted text to (VITE_PARSER_URL).
    Value: !GetAtt ParserFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref ParserFunction
  LogGroupName:
    Value: !Ref ParserLogGroup
  Model:
    Value: !Ref ParserModel
