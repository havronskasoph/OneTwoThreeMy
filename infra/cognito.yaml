AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Cognito user pool (Essentials tier) with managed login: sign-up and sign-in with
  email and password (self sign-up, email verification) and with Google, a public app client for
  the SPA (authorization code + PKCE), and a prefix domain for the managed login pages.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/auth/callback,http://localhost:5173/auth/callback
    Description: Where managed login may send users back after sign-in (the Makefile adds the site's).
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/,http://localhost:5173/
    Description: Where managed login may send users after signing out.
  GoogleClientId:
    Type: String
    MinLength: 1
    Description: >-
      OAuth client ID (type Web application) from Google Cloud, with the redirect URI
      https://<domain prefix>.auth.<region>.amazoncognito.com/oauth2/idpresponse.
  GoogleClientSecret:
    Type: String
    MinLength: 1
    NoEcho: true
    Description: OAuth client secret from Google Cloud (kept in .env, never in the repository).

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      # Managed login needs Essentials; the first 10,000 monthly active users are free.
      UserPoolTier: ESSENTIALS
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName
      # Users sign in with their email; Cognito sends a code to verify it on sign-up.
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # Cognito's own sender (about 50 emails a day), enough until SES is set up.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }

  # Managed login pages and OAuth endpoints at https://<prefix>.auth.<region>.amazoncognito.com.
  # The prefix must be unique across AWS, hence the account ID.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # Public client (no secret): a browser cannot keep one, so the code flow is protected with PKCE.
  # The backend only verifies the ID tokens it receives.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # A client naming a provider that does not exist yet fails to create.
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      SupportedIdentityProviders: [COGNITO, Google]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls

  # Without a style, a version 2 domain has no sign-in page to show; use Cognito's default look.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  Issuer:
    Description: Issuer (iss) of the pool's tokens; its JWKS is at <Issuer>/.well-known/jwks.json.
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  HostedUiDomain:
    Description: Domain of the managed login pages and OAuth endpoints.
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  GoogleRedirectUri:
    Description: Authorised redirect URI for the Google OAuth client.
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
